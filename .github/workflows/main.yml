name: MIUI 小米社区自动任务

on:
  schedule:
    - cron: '0 2 * * *'        # 每天北京时间 10:00 运行（UTC+8）
  workflow_dispatch:           # 支持手动触发

jobs:
  miui-task:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 pdm
        run: |
          python -m pip install --upgrade pip
          pip install pdm

      - name: 安装项目依赖
        run: pdm install

      - name: 配置 config.yaml
        run: |
          cat > data/config.yaml << 'EOF'
          preference:
            geetest_url: ''
            geetest_params: {}
            geetest_data: {}

          accounts:
            - uid: '${{ secrets.MIUI_UID }}'
              password: '${{ secrets.MIUI_PASSWORD }}'
              cookies: '${{ secrets.MIUI_COOKIES }}'
              login_user_agent: 'Mozilla/5.0 (Linux; Android 13; SM-S9110) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36'
              user_agent: 'Mozilla/5.0 (Linux; Android 13; SM-S9110) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36'
              CheckIn: false                    # 先关闭签到，避免验证码
              BrowseUserPage: true
              BrowsePost: true
              ThumbUp: true
              BrowseSpecialPage: true
              BoardFollow: true
              CarrotPull: true                 # 拔萝卜风险高，建议关闭
              WxSign: true

          ONEPUSH:
            notifier: pushplus
            params:
              title: MIUI任务通知
              markdown: true
              token: '${{ secrets.TOKEN }}'
          EOF

      - name: 运行小米社区签到任务
        run: pdm run python miuitask.py

      - name: 上传运行日志
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: miui-logs
          path: |
            *.log
            data/*.log
