name: MIUI 小米社区自动任务

on:
  schedule:
    - cron: '0 2 * * *'      # 每天北京时间 10:00 运行（UTC+8）
  workflow_dispatch:         # 支持手动点击运行

jobs:
  miui-task:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 pdm（推荐方式）
        run: |
          python -m pip install --upgrade pip
          pip install pdm

      - name: 安装项目依赖
        run: pdm install

      - name: 配置 config.yaml（方式一：从 Secrets 生成，推荐）
        run: |
          cat > data/config.yaml << 'EOF'
          preference:
            geetest_url: ''
            geetest_params: {}
            geetest_data: {}
          accounts:
            - uid: '${{ secrets.MIUI_UID }}'
              password: '${{ secrets.MIUI_PASSWORD }}'
              cookies: '${{ secrets.MIUI_COOKIES }}'
              user_agent: 'Mozilla/5.0 (Linux; Android 13; SM-S9110) AppleWebKit/537.36'
          CheckIn: false
          BrowseUserPage: true
          BrowsePost: true
          BrowseVideoPost: true
          ThumbUp: true
          BrowseSpecialPage: true
          BoardFollow: true
          CarrotPull: true
          WxSign: true
          ONEPUSH:
            notifier: serverchanturbo
            params:
              title: MIUI任务通知
              sctkey: ${{ secrets.SCTKEY }}
          EOF

      - name: 运行小米社区签到任务
        run: pdm run python miuitask.py

      - name: 上传运行日志（可选，便于查看结果）
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: miui-logs
          path: |
            *.log
            data/*.log
