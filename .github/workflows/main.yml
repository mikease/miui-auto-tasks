name: MIUI 小米社区自动任务

on:
  schedule:
    # - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  miui-task:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 pdm
        run: |
          python -m pip install --upgrade pip
          pip install pdm

      - name: 安装项目依赖
        run: pdm install

      # 先让脚本自动生成 config.yaml
      - name: 生成默认 config.yaml
        run: pdm run python miuitask.py --help || true   # 触发生成配置文件

      # 然后覆盖关键配置（更安全，缩进由这里控制）
      - name: 配置账号信息
        run: |
          cat > data/config.yaml << 'EOF'
          preference:
            geetest_url: ''
            geetest_params: {}
            geetest_data: {}

          accounts:
            - uid: '${{ secrets.MIUI_UID }}'
              password: '${{ secrets.MIUI_PASSWORD }}'
              cookies: '${{ secrets.MIUI_COOKIES }}'
              login_user_agent: 'Mozilla/5.0 (Linux; Android 13; SM-S9110) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36'
              user_agent: 'Mozilla/5.0 (Linux; Android 13; SM-S9110) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36'
              CheckIn: false
              BrowseUserPage: false
              BrowsePost: true
              ThumbUp: false
              BrowseSpecialPage: false
              BoardFollow: false
              CarrotPull: false

          ONEPUSH:
            notifier: pushplus
            params:
              title: MIUI任务通知
              markdown: true
              token: '${{ secrets.TOKEN }}'
          EOF

      - name: 运行小米社区签到任务
        run: pdm run python miuitask.py

      - name: 上传运行日志
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: miui-logs
          path: |
            *.log
            data/*.log
